name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build and install the Rust extension
        run: python -m maturin build --release --manifest-path src/tournament/tcg_engine/Cargo.toml && python -m pip install src/tournament/tcg_engine/target/wheels/*.whl
      - name: Run tests
        run: python -m pytest -q
      - name: Check test inventory
        run: python tools/qa-harness/test_inventory.py --check
      - name: Audit test quality
        run: python tools/qa-harness/test_quality_audit.py --tests tests --package src
      - name: Check reported intervals
        run: PYTHONPATH=. python tools/qa-harness/interval_sanity.py --spec tools/qa-harness/interval_spec_h1.py
      - name: Run minimum-match mutation sweep
        run: python tools/qa-harness/mutation_sweep.py --repo . --mutations tools/qa-harness/mutations.minmatches.json --pythonpath .
      - name: Run remediated mutation sweep
        run: python tools/qa-harness/mutation_sweep.py --repo . --mutations tools/qa-harness/mutations.pr5-remediated.json --pythonpath .
      - name: Check card-model intervals
        run: PYTHONPATH=. python tools/qa-harness/interval_sanity.py --spec tools/qa-harness/interval_spec_card_model.py --draws 300
      - name: Check clustered card-model errors
        run: PYTHONPATH=. python tools/qa-harness/cluster_se_check.py
      - name: Run BDIF statistics mutation sweep
        run: python tools/qa-harness/mutation_sweep.py --repo . --mutations tools/qa-harness/mutations.bdif-statistics.json --pythonpath .
