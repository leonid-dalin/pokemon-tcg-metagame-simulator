# docker-compose.yml
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: 
      context: .
      network: host
    command: [ "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4" ]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/?db=0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - shared_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
      image: cr.jaegertracing.io/jaegertracing/jaeger:2.17.0
      ports:
        - "16686:16686" # Web UI
        - "4317:4317"   # OTLP gRPC
        - "4318:4318"   # OTLP HTTP
        - "5778:5778"   # Sampling strategies
        - "9411:9411"   # Zipkin fallback

  worker:
    build: 
      context: .
      network: host
    user: "1000:1000"
    command: [ "huey_consumer", "src.worker.queue.huey", "--worker-type=process", "--workers=2" ]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/?db=0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - PYTHONPATH=/app
    volumes:
      - shared_data:/app/data
    depends_on:
      - jaeger
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "2G"
          cpus: "2.0"

  ui:
    build: 
      context: .
      network: host
    command: [ "streamlit", "run", "src/ui/app.py" ]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - shared_data:/app/data
    depends_on:
      - api
      - jaeger
      
volumes:
  shared_data:	
